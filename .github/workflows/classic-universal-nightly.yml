name: Classic Universal nightly (catalogo + musl/glibc)

# Idem que classic-universal-latest.yml (mismo AppDir AnyLinux, SquashFS
# tipo 2) pero fijo al canal nightly-classic, con cron diario.
# Ver ese workflow para el porqué: es el pipeline AnyLinux probado con
# PACKAGER=squashfs, no un empaquetado nuevo.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      PACKAGER: squashfs
      OUTNAME: Trinity_Launcher-x86_64-classic.AppImage
      CHANNEL: nightly

    steps:
      - name: Instalar dependencias base
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Clonar mcpe-nx
        run: git clone ${{ secrets.MCPE_NX }} mcpe-nx > /dev/null 2>&1

      - name: Construir AppImage classic-universal
        env:
          UPINFO: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|nightly-classic|Trinity_Launcher-x86_64-classic.AppImage.zsync
        run: sh ./trinity-appimage.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Trinity_Launcher-x86_64-classic-nightly
          path: dist

  release:
    if: ${{ needs.build.result == 'success' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Trinity_Launcher-x86_64-classic-nightly
          merge-multiple: true

      - name: Subir a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-classic
          files: |
            Trinity_Launcher-x86_64-classic.AppImage
            *.zsync