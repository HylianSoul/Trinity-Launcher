name: Classic Universal latest (catalogo + musl/glibc)

# Edicion para el catalogo appimage.github.io. NO es un empaquetado nuevo:
# es EXACTAMENTE el pipeline AnyLinux (quick-sharun + sharun + glibc propia,
# ya probado en Arch) con PACKAGER=squashfs, que envuelve el mismo AppDir
# con el appimagetool clasico -> SquashFS tipo 2, el unico formato que monta
# el test del catalogo (error-not-squashfs con DwarFS).
#
# Reglas del catalogo que cumple: una sola x86_64 por tag, nombre sin
# version/nightly/debug, update-info + .zsync, icono, .DirIcon,
# desktop-file-validate, metainfo AppStream, X11 forzado, y el mismo
# ANYLINUX_LIB=0 que hace funcionar login/audio/multijugador.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de release'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - nightly
  schedule:
    - cron: '0 7 * * *'

jobs:
  build:
    # El catalogo solo prueba x86_64 (aarch64 queda fuera por regla).
    runs-on: ubuntu-24.04
    container: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      PACKAGER: squashfs
      CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || github.event.inputs.channel || 'latest' }}

    steps:
      - name: Instalar dependencias base
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4

      - name: Clonar mcpe-nx
        run: git clone ${{ secrets.MCPE_NX }} mcpe-nx > /dev/null 2>&1

      - name: Construir AppImage classic-universal
        env:
          UPINFO: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|${{ github.event_name == 'schedule' && 'nightly-classic' || github.event.inputs.channel }}-classic|Trinity_Launcher-x86_64-classic.AppImage.zsync
        run: sh ./trinity-appimage.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Trinity_Launcher-x86_64-classic-${{ env.CHANNEL }}
          path: dist

  release:
    if: ${{ needs.build.result == 'success' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || github.event.inputs.channel || 'latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Trinity_Launcher-x86_64-classic-${{ env.CHANNEL }}
          merge-multiple: true

      - name: Subir a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CHANNEL }}-classic
          files: |
            Trinity_Launcher-x86_64-classic.AppImage
            *.zsync