name: AnyLinux Latest

on:
  workflow_dispatch:

concurrency:
  group: anylinux-latest

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      PACKAGER: squashfs
      OUTNAME: Trinity_Launcher-${{ matrix.arch }}.AppImage
      CHANNEL: latest
    steps:
      - run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .ccache
            .zig-cache
          key: anylinux-latest-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: anylinux-latest-${{ matrix.arch }}-

      - run: git clone --quiet ${{ secrets.MCPE_NX }} mcpe-nx

      - name: Patch client wrapper
        run: |
          set -eu
          [ -f trinity-appimage.sh ] || { echo "::error::trinity-appimage.sh no encontrado"; exit 1; }
          if grep -q 'mcpelauncher-client.real' trinity-appimage.sh; then
            echo "ya parcheado"
            exit 0
          fi

          cat > client-wrapper.sh <<'W_EOF'
          #!/bin/sh
          DIR=$(CDPATH= cd "$(dirname "$(readlink -f "$0")")" && pwd)
          for L in "$DIR"/../lib/ld-linux-* "$DIR"/../lib64/ld-linux-*; do
            if [ -f "$L" ]; then
              exec "$L" --library-path "$DIR/../lib:$DIR/../lib64" "$DIR/mcpelauncher-client.real" "$@"
            fi
          done
          echo "trinity: no se encontro el loader incluido" >&2
          exit 1
          W_EOF

          cat > trinity-fix.snippet <<'S_EOF'
          TWRAP_APPD="${APPDIR:-$GITHUB_WORKSPACE/AppDir}"
          [ -d "$TWRAP_APPD/shared/bin" ] || TWRAP_APPD="$PWD/AppDir"
          [ -d "$TWRAP_APPD/shared/bin" ] || TWRAP_APPD="$GITHUB_WORKSPACE/AppDir"
          TWRAP_BIN="$TWRAP_APPD/shared/bin"
          if [ -f "$TWRAP_BIN/mcpelauncher-client" ] && [ ! -e "$TWRAP_BIN/mcpelauncher-client.real" ]; then
            mv "$TWRAP_BIN/mcpelauncher-client" "$TWRAP_BIN/mcpelauncher-client.real"
            cp "$GITHUB_WORKSPACE/client-wrapper.sh" "$TWRAP_BIN/mcpelauncher-client"
            chmod +x "$TWRAP_BIN/mcpelauncher-client"
            if [ -e "$TWRAP_APPD/bin/mcpelauncher-client" ] || [ -L "$TWRAP_APPD/bin/mcpelauncher-client" ]; then
              ln -sf ../shared/bin/mcpelauncher-client "$TWRAP_APPD/bin/mcpelauncher-client"
            fi
            echo "trinity-fix: mcpelauncher-client usa el loader incluido"
          fi
          S_EOF

          patch_one() {
            S=$1
            grep -q 'mcpelauncher-client.real' "$S" && return 0
            grep -Eq '(make-appimage|make_appimage|appimagetool|mksquashfs|dwfs)' "$S" || return 1
            cp "$S" "$S.bak"
            N=$(mktemp)
            while IFS= read -r L; do
              case "$L" in
                *make-appimage*|*make_appimage*|*appimagetool*|*mksquashfs*|*dwfs*) cat trinity-fix.snippet ;;
              esac
              printf '%s\n' "$L"
            done < "$S.bak" > "$N"
            mv "$N" "$S"
            if ! sh -n "$S"; then
              echo "::error::parcheo rompio la sintaxis de $S"
              cp "$S.bak" "$S"
              exit 1
            fi
            echo "trinity-fix: parcheado $S"
          }

          patch_one trinity-appimage.sh || { echo "::error::no se encontro ancla de empaquetado en trinity-appimage.sh"; exit 1; }
          for EXTRA in quick-sharun.sh */quick-sharun.sh; do
            [ -f "$EXTRA" ] || continue
            patch_one "$EXTRA" || true
          done

      - run: |
          sleep 10
          sh ./trinity-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Trinity_Launcher-${{ matrix.arch }}-latest
          path: dist

  smoke-test:
    needs: build
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Trinity_Launcher-${{ matrix.arch }}-latest

      - name: GLIBC smoke test
        run: |
          APP=$(find . -name '*.AppImage' -type f | head -n1)
          [ -n "$APP" ] || { echo "::error::AppImage no encontrado en el artifact"; exit 1; }
          chmod +x "$APP"
          "$APP" --appimage-extract > /dev/null
          [ -f squashfs-root/shared/bin/mcpelauncher-client ] || { echo "::error::falta shared/bin/mcpelauncher-client"; exit 1; }
          if [ "$(head -c 2 squashfs-root/shared/bin/mcpelauncher-client)" != "#!" ]; then
            echo "::error::wrapper ausente en el AppImage"
            exit 1
          fi
          timeout 30 ./squashfs-root/shared/bin/mcpelauncher-client --help > client.log 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60 xvfb-run -a "$APP" > ui.log 2>&1 || true
          if grep -E 'GLIBC_|loader incluido' client.log ui.log; then
            echo "::error::regresion GLIBC: el cliente carga la glibc del host"
            exit 1
          fi
          echo "smoke-test OK: sin errores de GLIBC"

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            Trinity_Launcher-*.AppImage
            *.zsync
